# See: https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "edky"
version = "0.1.0"
authors = ["Arto Bendiken"]
edition = "2024"
#rust-version = "1.85"
description = "Convert Ed25519 public keys between various encoding formats."
#documentation = "https://docs.rs/edky"
readme = true
homepage = "https://edky.dev"
repository = "https://github.com/artob/edky"
license = "Unlicense"
keywords = []
categories = []
publish = false

[features]
default = ["all", "std"]
all = []
alloc = ["distrib/alloc"]
std = ["alloc", "distrib/std"]
unstable = []

[lib]
crate-type = ["cdylib"]

[dependencies]
distrib = { version = "0.0.1", default-features = false, features = ["export", "ruby"] }
edky_rs = { package = "edky", version = "0.1.0" }
rb-sys = { version = "0.9", features = ["stable-api-compiled-fallback"] }

[dev-dependencies]
rb-sys-test-helpers = "0.3"

[build-dependencies]
distrib-build = { version = "0.0.1", default-features = false, features = ["std", "ruby"] }
